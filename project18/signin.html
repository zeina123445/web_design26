<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/account.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/signin.css">
    <link rel="stylesheet" href="css/product.css">
</head>

<body>

    <div class="container">

        <div class="row align-items-center">

            <!-- Image -->
            <div class="col-md-6">
                <img src="images/SignIN.jpg" alt="Living room" class="img-fluid w-100 rounded-4">
            </div>


            <!-- Sign In -->
            <div class="col-md-6">
                <div class="p-5">
                    <h2> Sign In </h2>
                    <p class="text-secondary">
                        Don't have an account yet?
                        <a href="#" class="text-success text-decoration-none">
                            Sign Up
                        </a>
                    </p>


                    <form class="row gy-3 my-3" id="registerForm" autocomplete="off">
                        <div class="mt-4">
                            <input type="text" class="form-control" id="userName" name="userName"
                                placeholder="Your username or email address"> <small class="text-danger"></small>
                        </div>
                        <div class="mt-4">
                            <input type="text" class="form-control" placeholder="enter your password" id="userPassword">
                            <small class="text-danger"></small>
                        </div>


                        <div class="d-flex align-items-center justify-content-between mt-4">
                            <div class="d-flex align-items-center gap-2">
                                <input type="checkbox" class="form-check-input" id="remember">

                                <label class="form-check-label" for="remember">
                                    Remember me
                                </label>
                            </div>

                            <a href="#" class="text-dark text-decoration-none">
                                Forgot password?
                            </a>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-4">
                            Sign In
                        </button>
                    </form>
                </div>

            </div>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/signin.js"></script>
<script src="js/footer.js"></script>

</body>

</html>
