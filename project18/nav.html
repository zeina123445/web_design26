<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>nav</title>
        
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> 
          
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- <link rel="stylesheet" href="style.css"> -->
    </head>
        <body>
   <!-- announcement -->
          <div class="bg-light py-2 position-relative">

        <div class="d-flex justify-content-center align-items-center gap-2 small">

            <i class="bi bi-percent"></i>

            <span>30% off storewide — Limited time!</span>

            <a href="#" class="text-primary d-none d-sm-inline">
                Shop Now →
            </a>

        </div>

        <button
            class="btn position-absolute top-50 end-0 translate-middle-y me-2 border-0">

            <i class="bi bi-x-lg"></i>

        </button>

    </div>


    <!--  NAVBAR  -->

    <nav class="navbar navbar-expand-lg bg-white">

        <div class="container">

            <!-- mobile + logo -->
        <div class="d-flex align-items-center">

            <!-- mobile menu button -->
            <button
                class="navbar-toggler border-0 p-0 me-3 d-lg-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Logo -->
            <a class="navbar-brand fw-bold mb-0" href="#">
                VisioCreate
            </a>

        </div>

            <!-- Navbar content -->

            <div
                class="collapse navbar-collapse"
                id="navbarContent">

                <!-- Links -->

                <ul class="navbar-nav mx-auto gap-lg-4">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Shop
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Product
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Contact Us
                        </a>
                    </li>

                </ul>


                <!-- icons -->

                <div class="d-flex align-items-center gap-3">

                    <i class="bi bi-search fs-5"></i>

                    <i class="bi bi-person-circle fs-5"></i>

                

                </div>

            </div>
            <div class="d-flex align-items-center gap-2">

            <i class="bi bi-bag fs-5" role="button" data-bs-toggle="offcanvas" data-bs-target="#cartSidebar"></i>

            <span class="badge rounded-pill bg-dark">
                0
            </span>

        </div>

        </div>

    </nav>



            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
               integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>
               <!-- <script src="script.js"></script> -->
        </body>
</html>
