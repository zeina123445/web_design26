<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <form action="">
            <div>
                   <label for="">name: </label>
            <input type="text" pattern="[A-Za-z]{3,5}">
            </div>
            <div>
            <label for="">email: </label>
            <input type="text" pattern="[A-Za-z0-9,_%+-]+@[A-Za-z0-9]\.[A-Za-z]{2,}$" required >
       </div>
       <div>
        <label for="">password:</label>
        <input type="password" pattern="?=*[A-Z]?=*[a-z]?=*[0-9]?=[!@#$%^&*]">
       </div>
       <div>
        <label for="">mobil: </label>
        <input type="number" min="11" max="11" >
       </div>
       <div>
        <label for="">address: </label>
        <input type="text" required pattern="[A-Za-z]">
       </div>
       <div>
        <select name="" id="">
            <option value="">css</option>
            <option value="">js</option>
            <option value="">html</option>
        </select>
       </div>
       <div>
        <label for="">range: </label>
        <input type="range" name="range" min="300" max="500">
       </div>
       <div>
        <label for="">image</label>
        <input type="file" accept="image">
       </div>

       <div>
        <input type="submit">
       </div>
        </form>
    </body>
</html>
