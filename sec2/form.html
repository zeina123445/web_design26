<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <fieldset> 
        <legend>Personal Information</legend>
        <form action="">
            <div>
                   <label for="name">name: </label>
            <input type="text" id="name" pattern="[A-Za-z]{3,5}">
            </div>
            <div>
            <label for="email">email: </label>
            <input type="email"id="email" pattern="[A-Za-z0-9,_%+-]+@[A-Za-z0-9]\.[A-Za-z]{2,}$" required >
       </div>
       <div>
        <label for="pass">password:</label>
        <input type="password" id="pass" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&^#])[A-Za-z\d@$!%*?&^#]{8,}">
       </div>
       <div>
        <label for="mo">mobile: </label>
        <input type="tel" id="mo" pattern="^01[0125][0-9]{8}$" >
       </div>
       <div>
        <label for="address">address: </label>
        <input type="text" id="address" required pattern="[A-Za-z ]+">
       </div>
       <div>
        <select name="" id="">
            <option value="">css</option>
            <option value="">js</option>
            <option value="">html</option>
        </select>
       </div>
       <div>
        <label for="">range: </label>
        <input type="range" name="range" min="300" max="500">
       </div>
       <div>
        <label for="">image</label>
        <input type="file" accept="image">
       </div>

       <div>
        <input type="submit">
       </div>
        </form>
        </fieldset>
    </body>
</html>
